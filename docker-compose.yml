services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bidrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidrush_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bidrush_db}
    ports:
      - "5432:5432"
    volumes:
      - bidrush_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidrush} -d ${POSTGRES_DB:-bidrush_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bidrush_postgres_data: